[package]
name = "rzp"
version = "2.1.0"
repository = "https://github.com/ZJQb0y/rzp"
edition = "2021"
description = "RZP — a from-scratch, streaming, integrity-checked compression format"
authors = ["张俊琦 <mokaifurry@outlook.com>"]
license = "MIT OR Apache-2.0"
keywords = ["compression", "lz77", "huffman", "aead", "archive"]
categories = ["compression", "command-line-utilities"]
# 发布到 crates.io 时排除本地产物、模糊测试语料与打包脚本。
exclude = [
    "fuzz/",
    "dist/",
    "target/",
    "package.sh",
    "package.ps1",
]

[lib]
name = "rzp"
path = "src/lib.rs"

[[bin]]
name = "rzp"
path = "src/bin/rzp.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[package.metadata.deb]
maintainer = "张俊琦 <mokaifurry@outlook.com>"
copyright = "2026 张俊琦 <mokaifurry@outlook.com>"
license-file = "LICENSE"
section = "utils"
priority = "optional"
# shared-mime-info 提供 update-mime-database 与 /usr/share/mime/packages 的 dpkg 触发器，
# 安装/卸载时自动重建 MIME 数据库，使 .rzp 文件能显示对应图标。
depends = ["$auto", "shared-mime-info"]
# 右键菜单扩展的运行依赖；用 recommends 而非 depends，避免在无图形桌面的
# 服务器上强制拉入整个 Nautilus。
recommends = ["python3-nautilus", "python3-gi"]
assets = [
    "$auto",
    ["packaging/mime/rzp.xml", "usr/share/mime/packages/rzp.xml", "644"],
    ["assets/rzp.svg", "usr/share/icons/hicolor/scalable/mimetypes/application-x-rzp.svg", "644"],
    ["assets/rzp.png", "usr/share/icons/hicolor/512x512/mimetypes/application-x-rzp.png", "644"],
    ["packaging/nautilus/rzp-menu.py", "usr/share/nautilus-python/extensions/rzp-menu.py", "644"],
]
maintainer-scripts = "packaging/debian"
